# Supabase pauses free projects after a week with no activity. This pings the database once a day.
# Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions).
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets not set yet; skipping."; exit 0; fi
          curl -fsS "$URL/rest/v1/categories?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Supabase is awake."
